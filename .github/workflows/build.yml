name: Build Desktop Clients

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Cancel superseded runs on the same branch/PR to save CI minutes — does not
# affect the Windows/macOS independence requirement below (that's about job
# failure isolation, not run cancellation on new pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Dummy, non-secret value — `prisma generate` only reads the DB URL to
  # satisfy schema validation for the datasource block, it never connects.
  # Real credentials are never present in this workflow.
  DATABASE_URL: 'mysql://ci:ci@127.0.0.1:3306/ci_placeholder'

jobs:
  build-macos-modern:
    name: Build macOS Client (Modern)
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Build macOS DMG
        working-directory: frontend
        run: npx electron-builder --mac --publish=never

           - name: Find Build Files
        run: |
          echo "Current directory:"
          pwd

          echo "================ DMG FILES ================"
          find . -type f -name "*.dmg"

          echo "================ ZIP FILES ================"
          find . -type f -name "*.zip"

          echo "================ DIST DIRECTORIES ================"
          find . -type d -name "dist*"

      - name: Upload Modern DMG to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/dist-electron/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-legacy:
    name: Build macOS Client (Legacy 10.14)
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Build macOS Legacy DMG
        working-directory: frontend
        run: npx electron-builder --mac --config electron-builder.legacy-mac.json --publish=never

            - name: Find Build Files
        run: |
          echo "Current directory:"
          pwd

          echo "================ DMG FILES ================"
          find . -type f -name "*.dmg"

          echo "================ ZIP FILES ================"
          find . -type f -name "*.zip"

          echo "================ DIST DIRECTORIES ================"
          find . -type d -name "dist*"

      - name: Upload Legacy DMG to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/dist-electron-legacy/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}