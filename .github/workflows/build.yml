name: Build Desktop Clients

# ─── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition to build (workflow_dispatch only — push/pull_request/release are unaffected and always build every job below)'
        type: choice
        default: all
        options:
          - all
          - mac-standalone-modern
          - mac-client-modern
          - mac-client-legacy
  release:
    types: [published]

# Cancel superseded runs on the same branch/PR to save CI minutes — does not
# affect the Windows/macOS independence requirement below (that's about job
# failure isolation, not run cancellation on new pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Dummy, non-secret value — `prisma generate` only reads the DB URL to
  # satisfy schema validation for the datasource block, it never connects.
  # Real credentials are never present in this workflow.
  DATABASE_URL: 'mysql://ci:ci@127.0.0.1:3306/ci_placeholder'

jobs:
  build-macos-modern:
    name: Build macOS Client (Modern — Manager edition, remote-server only)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.edition == 'all' || github.event.inputs.edition == 'mac-client-modern'
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production asset check (pre-build)
        working-directory: frontend
        run: npm run assets:verify:source

      # Manager edition — client-only, no backend/MySQL bundled. This is the
      # "Mac Client" build: it must never share the Windows Server's
      # embedded/full-backend electron-builder config (that config bundles
      # ../backend and is meant for the Windows installer / the old,
      # mislabeled Mac build this job used to produce). Backend deps are
      # deliberately NOT installed and prisma generate is NOT run in this
      # job — nothing here should be able to import Prisma or spawn a local
      # backend even by accident.
      - name: Build Frontend (Manager edition — client-only, server mode)
        working-directory: frontend
        run: npm run build:manager

      - name: Build macOS Client DMG + ZIP (x64 + arm64)
        working-directory: frontend
        run: npx electron-builder --mac --config electron-builder.manager.json --publish=never

      - name: Production asset check (packaged)
        working-directory: frontend
        run: node scripts/assetSafety/verify-packaged.mjs mac-client-modern

      - name: Inspect packaged app (edition identity, no backend/MySQL, server-mode default — BOTH arches)
        working-directory: frontend
        run: |
          set -e
          # A multi-arch mac target produces TWO separate .app bundles (one
          # per arch) — inspect BOTH, not just whichever `find` returns
          # first. Newline-delimited `while read` (not `for d in $(find ...)`)
          # because the product name has spaces ("PETSHROW ERP Manager.app").
          APP_DIRS=$(find ../dist-electron-manager -type d -name "*.app" -not -path "*/Contents/*")
          echo "App bundles found:"; echo "$APP_DIRS"
          [ -n "$APP_DIRS" ] || { echo "FAIL: no .app bundle found at all"; exit 1; }
          COUNT=$(echo "$APP_DIRS" | grep -c .)
          [ "$COUNT" -eq 2 ] || echo "NOTE: expected 2 .app bundles (x64 + arm64), found $COUNT"

          i=0
          while IFS= read -r APP_DIR; do
            i=$((i+1))
            echo ""
            echo "########## Inspecting bundle $i: $APP_DIR ##########"
            ASAR_DIR="/tmp/asar-client-modern-$i"

            echo "================ package.json name (edition detection) ================"
            npx asar extract "$APP_DIR/Contents/Resources/app.asar" "$ASAR_DIR"
            NAME=$(node -e "console.log(require('$ASAR_DIR/package.json').name)")
            echo "Packaged name: $NAME"
            [ "$NAME" = "petshrow-erp-manager" ] || { echo "FAIL: packaged app.asar name is '$NAME', expected 'petshrow-erp-manager'"; exit 1; }

            echo "================ backend/ must NOT be present (client-only) ================"
            if [ -d "$APP_DIR/Contents/Resources/backend" ]; then
              echo "FAIL: backend/ is bundled — this is supposed to be a client-only build"; exit 1
            fi
            echo "OK: no backend/ bundled"

            echo "================ mysql/ must NOT be present (no local/managed MySQL) ================"
            if [ -d "$APP_DIR/Contents/Resources/mysql" ]; then
              echo "FAIL: mysql/ is bundled — this is supposed to be a client-only build"; exit 1
            fi
            echo "OK: no mysql/ bundled"

            echo "================ app metadata version ================"
            APP_VERSION=$(node -e "console.log(require('$ASAR_DIR/package.json').version)")
            echo "Packaged version: $APP_VERSION"
            [ "$APP_VERSION" = "1.1.2" ] && echo "OK: version is 1.1.2" || { echo "FAIL: version is '$APP_VERSION', expected 1.1.2"; exit 1; }
          done <<< "$APP_DIRS"

      - name: Runtime test — server-mode connection to a stub Windows Server, no local backend/MySQL ever spawned
        working-directory: frontend
        timeout-minutes: 5
        run: |
          set -e
          NATIVE_ARCH=$(uname -m)
          APP_DIR=""
          while IFS= read -r d; do
            # Pick the bundle matching this runner's native arch by checking
            # the Mach-O binary itself (client bundles carry no per-arch
            # resource dir to key off, unlike the Standalone job).
            BIN=$(find "$d/Contents/MacOS" -type f -maxdepth 1 | head -n1)
            if [ "$NATIVE_ARCH" = "arm64" ] && file "$BIN" | grep -q "arm64"; then APP_DIR="$d"; break; fi
            if [ "$NATIVE_ARCH" != "arm64" ] && file "$BIN" | grep -q "x86_64"; then APP_DIR="$d"; break; fi
          done < <(find ../dist-electron-manager -type d -name "*.app" -not -path "*/Contents/*")
          [ -n "$APP_DIR" ] || { echo "FAIL: no .app bundle matches native arch $NATIVE_ARCH"; exit 1; }
          BIN=$(find "$APP_DIR/Contents/MacOS" -type f -maxdepth 1 | head -n1)
          echo "Using native-arch bundle: $APP_DIR"

          echo "================ start a stub 'Windows Server v1.1.2' on 127.0.0.1 ================"
          # Minimal HTTP stand-in for the authoritative Windows Server this
          # client must talk to — proves the client's serverUrl config is
          # actually used for API calls, without needing a real Windows box
          # in this macOS CI job.
          cat > /tmp/stub-server.mjs <<'JS'
          import http from 'http';
          import { writeFileSync } from 'fs';
          let hits = [];
          const server = http.createServer((req, res) => {
            hits.push(req.method + ' ' + req.url);
            res.setHeader('Content-Type', 'application/json');
            if (req.url === '/api/health') {
              res.end(JSON.stringify({ status: 'ok', db: 'connected', apiVersion: 1, authEnabled: false }));
            } else if (req.url.startsWith('/api/employees')) {
              res.end(JSON.stringify([]));
            } else {
              res.end(JSON.stringify({ ok: true, stub: true }));
            }
          });
          server.listen(58631, '127.0.0.1', () => console.log('stub server listening on 58631'));
          process.on('SIGTERM', () => { writeFileSync('/tmp/stub-hits.log', hits.join('\n')); process.exit(0); });
          setInterval(() => writeFileSync('/tmp/stub-hits.log', hits.join('\n')), 1000);
          JS
          node /tmp/stub-server.mjs > /tmp/stub-server.log 2>&1 &
          STUB_PID=$!
          sleep 1

          # Electron's default userData folder name (where
          # connectionSettings.js's settingsFile() lives, via
          # app.getPath('userData')) is derived from the packaged app's name,
          # which can resolve to either the package.json "name"
          # (petshrow-erp-manager) or "productName" (PETSHROW ERP Manager)
          # depending on Electron version/platform behavior. Seed BOTH
          # candidate folders so this test isn't silently broken by guessing
          # wrong about which one Electron actually picked — a real user's
          # single install only ever has the one Electron resolves to.
          for NAME in "PETSHROW ERP Manager" "petshrow-erp-manager"; do
            DATA_ROOT="$HOME/Library/Application Support/$NAME"
            mkdir -p "$DATA_ROOT/config"
            cat > "$DATA_ROOT/config/connection-settings.json" <<'JSON'
          {"mode":"server","serverUrl":"http://127.0.0.1:58631"}
          JSON
          done
          echo "Seeded connection-settings.json (both candidate userData folders): mode=server, serverUrl=http://127.0.0.1:58631"

          echo "================ launch packaged Manager/Client app ================"
          "$BIN" > /tmp/client-run.log 2>&1 &
          APP_PID=$!
          sleep 15

          echo "================ never spawns a local backend or MySQL ================"
          LOCAL_BACKEND=$(pgrep -f "backend/src/index.js" || true)
          LOCAL_MYSQLD=$(pgrep -f "mysqld" || true)
          if [ -n "$LOCAL_BACKEND" ] || [ -n "$LOCAL_MYSQLD" ]; then
            echo "FAIL: client spawned a local process it must never spawn: backend=[$LOCAL_BACKEND] mysqld=[$LOCAL_MYSQLD]"
            kill -TERM "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          echo "OK: no local backend/mysqld process running"

          echo "================ nothing listening on the local backend port (5000) ================"
          if lsof -nP -iTCP:5000 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN; then
            echo "FAIL: something is listening on 127.0.0.1:5000 — client must never run its own backend"; exit 1
          fi
          echo "OK: port 5000 is not bound — no local backend"

          echo "================ client actually talked to the stub Windows Server ================"
          kill -TERM "$STUB_PID" 2>/dev/null || true
          sleep 2
          if [ -s /tmp/stub-hits.log ] && grep -q "/api/health" /tmp/stub-hits.log; then
            echo "OK: client called /api/health on the stub server (serverUrl config honored)"
            cat /tmp/stub-hits.log
          else
            echo "FAIL: stub server never received /api/health — client did not connect to serverUrl"
            echo "--- client log ---"; cat /tmp/client-run.log
            exit 1
          fi

          kill -TERM "$APP_PID" 2>/dev/null || true
          for i in $(seq 1 10); do kill -0 "$APP_PID" 2>/dev/null || break; sleep 1; done
          echo "================ RUNTIME TEST PASSED — server-mode only, no local backend/MySQL ================"

      - name: Runtime test — unreachable server never falls back to local mode
        working-directory: frontend
        timeout-minutes: 3
        run: |
          set -e
          NATIVE_ARCH=$(uname -m)
          APP_DIR=""
          while IFS= read -r d; do
            BIN=$(find "$d/Contents/MacOS" -type f -maxdepth 1 | head -n1)
            if [ "$NATIVE_ARCH" = "arm64" ] && file "$BIN" | grep -q "arm64"; then APP_DIR="$d"; break; fi
            if [ "$NATIVE_ARCH" != "arm64" ] && file "$BIN" | grep -q "x86_64"; then APP_DIR="$d"; break; fi
          done < <(find ../dist-electron-manager -type d -name "*.app" -not -path "*/Contents/*")
          BIN=$(find "$APP_DIR/Contents/MacOS" -type f -maxdepth 1 | head -n1)

          # Bogus, unreachable remote — nothing listens on this loopback port.
          # See the previous step for why both candidate userData folder
          # names are seeded.
          for NAME in "PETSHROW ERP Manager" "petshrow-erp-manager"; do
            DATA_ROOT="$HOME/Library/Application Support/$NAME"
            mkdir -p "$DATA_ROOT/config"
            cat > "$DATA_ROOT/config/connection-settings.json" <<'JSON'
          {"mode":"server","serverUrl":"http://127.0.0.1:58699"}
          JSON
          done

          "$BIN" > /tmp/client-run2.log 2>&1 &
          APP_PID=$!
          sleep 15

          LOCAL_BACKEND=$(pgrep -f "backend/src/index.js" || true)
          LOCAL_MYSQLD=$(pgrep -f "mysqld" || true)
          if [ -n "$LOCAL_BACKEND" ] || [ -n "$LOCAL_MYSQLD" ]; then
            echo "FAIL: client fell back to a local process when the remote server was unreachable: backend=[$LOCAL_BACKEND] mysqld=[$LOCAL_MYSQLD]"
            kill -TERM "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          if lsof -nP -iTCP:5000 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN; then
            echo "FAIL: something is listening on 127.0.0.1:5000 with an unreachable remote — local fallback occurred"; exit 1
          fi
          echo "OK: unreachable remote server produced no local backend/MySQL fallback"

          kill -TERM "$APP_PID" 2>/dev/null || true
          for i in $(seq 1 10); do kill -0 "$APP_PID" 2>/dev/null || break; sleep 1; done

      - name: Find Build Files
        run: |
          echo "Current directory:"
          pwd

          echo "================ DMG FILES ================"
          find . -type f -name "*.dmg"

          echo "================ ZIP FILES ================"
          find . -type f -name "*.zip"

          echo "================ DIST DIRECTORIES ================"
          find . -type d -name "dist*"

      - name: Upload Modern Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: petshrow-macos-client-modern
          path: |
            dist-electron-manager/*.dmg
            dist-electron-manager/*.zip
          if-no-files-found: error

      - name: Upload Modern Client artifact to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
           dist-electron-manager/*.dmg
           dist-electron-manager/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-standalone:
    name: Build macOS Standalone Edition (Local backend + managed MySQL)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.edition == 'all' || github.event.inputs.edition == 'mac-standalone-modern'
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      # No Apple Developer credentials are configured for this edition —
      # artifacts are intentionally UNSIGNED. Do not add CSC_LINK/notarize
      # secrets here without also updating the "Report signing status" step
      # below, which exists specifically so this is never silently claimed
      # as verified.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Cache bundled MySQL binaries
        uses: actions/cache@v4
        with:
          path: frontend/resources/mysql
          key: mysql-macos-${{ hashFiles('frontend/scripts/fetch-mysql-macos.mjs') }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production asset check (pre-build)
        working-directory: frontend
        run: npm run assets:verify:source

      # Requires TARGETS.<arch>.sha256 in fetch-mysql-macos.mjs to be filled
      # in from https://dev.mysql.com/downloads/mysql/ first — the script
      # deliberately refuses to download an unpinned/unverified binary, so
      # this step fails loudly (not silently) until that's done.
      - name: Fetch + verify bundled MySQL binaries (x64 + arm64)
        working-directory: frontend
        run: npm run fetch:mysql:mac

      - name: Build Frontend (Standalone edition)
        working-directory: frontend
        run: npm run build:standalone

      - name: Build macOS Standalone DMG + ZIP (x64 + arm64)
        working-directory: frontend
        run: npx electron-builder --mac --config electron-builder.standalone.json --publish=never

      - name: Inspect packaged app (edition identity, bundled resources, signing status — BOTH arches)
        working-directory: frontend
        run: |
          set -e
          # electron-builder produces TWO separate .app bundles for a
          # multi-arch mac target (one per arch, each in its own output
          # subfolder) — inspect BOTH, not just whichever `find` returns
          # first, and confirm each one only bundles its OWN arch's MySQL
          # binaries (not both, which would bloat every install with an
          # unusable foreign-arch mysqld).
          APP_DIRS=$(find ../dist-electron-standalone -type d -name "*.app" -not -path "*/Contents/*")
          echo "App bundles found:"; echo "$APP_DIRS"
          [ -n "$APP_DIRS" ] || { echo "FAIL: no .app bundle found at all"; exit 1; }
          COUNT=$(echo "$APP_DIRS" | grep -c .)
          [ "$COUNT" -eq 2 ] || echo "NOTE: expected 2 .app bundles (x64 + arm64), found $COUNT"

          i=0
          while IFS= read -r APP_DIR; do
            i=$((i+1))
            echo ""
            echo "########## Inspecting bundle $i: $APP_DIR ##########"
            ASAR_DIR="/tmp/asar-standalone-$i"

            echo "================ package.json name (edition detection) ================"
            npx asar extract "$APP_DIR/Contents/Resources/app.asar" "$ASAR_DIR"
            NAME=$(node -e "console.log(require('$ASAR_DIR/package.json').name)")
            echo "Packaged name: $NAME"
            [ "$NAME" = "petshrow-erp-standalone" ] || { echo "FAIL: packaged app.asar name is '$NAME', expected 'petshrow-erp-standalone'"; exit 1; }

            echo "================ backend/ present? ================"
            test -d "$APP_DIR/Contents/Resources/backend" && echo "OK: backend/ bundled" || { echo "FAIL: backend/ missing"; exit 1; }

            echo "================ managed MySQL binaries present (exactly this bundle's own arch) ================"
            MYSQL_ARCHES=$(ls "$APP_DIR/Contents/Resources/mysql" 2>/dev/null || true)
            echo "Bundled MySQL arch dir(s): $MYSQL_ARCHES"
            [ -n "$MYSQL_ARCHES" ] || { echo "FAIL: no mysql/ resource dir"; exit 1; }
            ARCH_DIR_COUNT=$(echo "$MYSQL_ARCHES" | grep -c .)
            [ "$ARCH_DIR_COUNT" -eq 1 ] || { echo "FAIL: expected exactly 1 arch dir bundled per .app, found $ARCH_DIR_COUNT ($MYSQL_ARCHES)"; exit 1; }
            for bin in mysqld mysql mysqldump mysqladmin; do
              test -f "$APP_DIR/Contents/Resources/mysql/$MYSQL_ARCHES/bin/$bin" && echo "OK: $bin present" || { echo "FAIL: $bin missing"; exit 1; }
            done

            echo "================ MySQL dependency closure (otool -L, this bundle's own arch: $MYSQL_ARCHES) ================"
            # otool -L is static Mach-O inspection, not execution — it works
            # for the NON-native arch too, so both bundles get this check on
            # a single runner even though actual mysqld execution (later
            # step) can only run the native one. For every kept binary and
            # every bundled lib, resolve each @loader_path/@rpath-relative
            # dependency to the exact path dyld will look for it at, and
            # fail loudly if that file isn't actually present in the
            # package — this is the same resolution fetch-mysql-macos.mjs
            # performs at provisioning time, re-checked here against the
            # final packaged bundle so a stale cache or a partial copy can
            # never silently ship.
            MYSQL_ROOT="$APP_DIR/Contents/Resources/mysql/$MYSQL_ARCHES"
            CLOSURE_FAIL=0
            CHECK_FILES=$(find "$MYSQL_ROOT/bin" "$MYSQL_ROOT/lib" -type f 2>/dev/null || true)
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              DEPS=$(otool -L "$f" 2>/dev/null | tail -n +2 | awk '{print $1}' | grep -E '^@(loader_path|rpath)' || true)
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                REL=$(echo "$dep" | sed -E 's#^@(loader_path|rpath)#.#')
                TARGET="$(cd "$(dirname "$f")" && cd "$(dirname "$REL")" 2>/dev/null && pwd)/$(basename "$REL")"
                if [ ! -f "$TARGET" ]; then
                  echo "FAIL: $f depends on '$dep' -> resolved to '$TARGET' which does not exist"
                  CLOSURE_FAIL=1
                fi
              done <<< "$DEPS"
            done <<< "$CHECK_FILES"
            [ "$CLOSURE_FAIL" = "0" ] && echo "OK: full otool -L dependency closure resolves inside mysql/$MYSQL_ARCHES/ for bundle $i" || { echo "FAIL: MySQL dependency closure incomplete for bundle $i ($MYSQL_ARCHES)"; exit 1; }

            echo "================ minimum macOS version ================"
            MIN_OS=$(plutil -extract LSMinimumSystemVersion raw "$APP_DIR/Contents/Info.plist")
            echo "$MIN_OS"
            [ "$MIN_OS" = "14.0.0" ] && echo "OK: minimum macOS is 14.0.0 (matches the bundled MySQL 8.4.3 binaries' own macOS 14+ requirement)" || { echo "FAIL: minimum macOS is '$MIN_OS', expected 14.0.0"; exit 1; }

            echo "================ Report signing status (never faked) ================"
            echo "Signing: NOT VERIFIED — no Apple Developer certificate configured for this build"
            echo "Notarization: NOT VERIFIED — no Apple credentials configured for this build"
            codesign -dv "$APP_DIR" 2>&1 || echo "(codesign check above is informational only, expected to show 'not signed')"

            echo "================ package hygiene — forbidden content must NOT be present ================"
            FORBIDDEN=0
            for pattern in "_loadtest" "audit_" "*_scan.json" ".env" ".env.example"; do
              if find "$APP_DIR/Contents/Resources" -iname "$pattern" 2>/dev/null | grep -q .; then
                echo "FAIL: forbidden pattern '$pattern' found under Resources/"
                find "$APP_DIR/Contents/Resources" -iname "$pattern"
                FORBIDDEN=1
              fi
            done
            if find "$APP_DIR/Contents/Resources/backend" -path "*/uploads/*" 2>/dev/null | grep -q .; then
              echo "FAIL: backend/uploads/ content leaked into the package"
              FORBIDDEN=1
            fi
            # A bare grep for "DB_PASSWORD"/"JWT_SECRET" as SUBSTRINGS matches
            # the app's own legitimate source (env-var/object-key NAMES, e.g.
            # mysqlManager.js's getConnectionEnv() or generateEnv.js's .env
            # template) every single time — that's expected source code, not
            # a leaked secret VALUE. The real check is that no actual .env
            # file (which would hold real VALUES) is packaged. Confirmed as
            # a false positive on the first real CI run (2026-08-15).
            if find "$ASAR_DIR" -iname ".env" 2>/dev/null | grep -q .; then
              echo "FAIL: an actual .env file (real secret values) was found inside app.asar"
              find "$ASAR_DIR" -iname ".env"
              FORBIDDEN=1
            fi
            [ "$FORBIDDEN" = "0" ] || { echo "FAIL: package hygiene check failed — see above"; exit 1; }
            echo "OK: no forbidden files, Windows-specific data, or secret material found in the package"

            echo "================ app metadata version / API_VERSION ================"
            APP_VERSION=$(node -e "console.log(require('$ASAR_DIR/package.json').version)")
            echo "Packaged version: $APP_VERSION"
            [ "$APP_VERSION" = "1.1.2" ] && echo "OK: version is 1.1.2" || { echo "FAIL: version is '$APP_VERSION', expected 1.1.2"; exit 1; }
            API_VERSION=$(node -e "console.log(require('$ASAR_DIR/backend/src/apiVersion.js').API_VERSION)" 2>/dev/null || echo "unreadable")
            echo "Packaged backend API_VERSION: $API_VERSION"
            [ "$API_VERSION" = "1" ] && echo "OK: API_VERSION is 1" || echo "NOTE: could not confirm API_VERSION from packaged backend (non-fatal, informational)"
          done <<< "$APP_DIRS"

      - name: Production asset check (packaged)
        working-directory: frontend
        run: node scripts/assetSafety/verify-packaged.mjs mac-standalone-modern

      - name: Direct runtime test of the bundled MySQL binary (native arch, real .app resources)
        working-directory: frontend
        timeout-minutes: 5
        run: |
          set -e
          NATIVE_ARCH=$(uname -m)
          if [ "$NATIVE_ARCH" = "arm64" ]; then MYSQL_ARCH_DIR="arm64"; else MYSQL_ARCH_DIR="x64"; fi
          # Two .app bundles exist (one per arch) — the wrong one can't run
          # natively on this runner at all (no Rosetta guarantee), so pick
          # the bundle whose OWN Resources/mysql/<arch> matches uname -m,
          # not just whichever `find` happens to return first. Product name
          # has spaces ("PETSHROW ERP Standalone.app"), so this MUST be a
          # newline-delimited `while read` loop, not `for d in $(find ...)`
          # — the latter word-splits on the spaces in the path itself and
          # silently never matches anything (confirmed on a real CI run,
          # 2026-08-15: "no .app bundle found containing mysql/arm64" even
          # though the bundle inspection step, which used `while read`,
          # had already found and verified that exact bundle moments earlier).
          APP_DIR=""
          while IFS= read -r d; do
            if [ -d "$d/Contents/Resources/mysql/$MYSQL_ARCH_DIR" ]; then APP_DIR="$d"; break; fi
          done < <(find ../dist-electron-standalone -type d -name "*.app" -not -path "*/Contents/*")
          [ -n "$APP_DIR" ] || { echo "FAIL: no .app bundle found containing mysql/$MYSQL_ARCH_DIR (native arch: $NATIVE_ARCH)"; exit 1; }
          MYSQL_BIN="$APP_DIR/Contents/Resources/mysql/$MYSQL_ARCH_DIR/bin"
          echo "Testing bundled MySQL for native arch: $NATIVE_ARCH -> $MYSQL_ARCH_DIR (bundle: $APP_DIR)"
          test -x "$MYSQL_BIN/mysqld" || { echo "FAIL: mysqld not found/executable at $MYSQL_BIN"; exit 1; }

          DATADIR=$(mktemp -d)
          echo "================ mysqld --initialize-insecure ================"
          "$MYSQL_BIN/mysqld" --initialize-insecure --datadir="$DATADIR" --basedir="$APP_DIR/Contents/Resources/mysql/$MYSQL_ARCH_DIR"
          echo "OK: data directory initialized"

          echo "================ mysqld start (loopback only, port 33061) ================"
          "$MYSQL_BIN/mysqld" --datadir="$DATADIR" --socket="$DATADIR/mysql.sock" --port=33061 \
            --bind-address=127.0.0.1 --pid-file="$DATADIR/mysqld.pid" --log-error="$DATADIR/mysqld.log" &
          MYSQLD_TEST_PID=$!

          READY=0
          for i in $(seq 1 30); do
            if "$MYSQL_BIN/mysqladmin" --host=127.0.0.1 --port=33061 ping >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "FAIL: mysqld did not become ready"; cat "$DATADIR/mysqld.log" || true; exit 1
          fi
          echo "OK: mysqld launched, mysqladmin ping succeeded"

          echo "================ loopback-only binding check (no LAN exposure) ================"
          BIND_CHECK=$(lsof -nP -iTCP:33061 -sTCP:LISTEN || true)
          echo "$BIND_CHECK"
          echo "$BIND_CHECK" | grep -q "127.0.0.1:33061" || { echo "FAIL: mysqld is not bound to 127.0.0.1"; exit 1; }
          if echo "$BIND_CHECK" | grep -qE '\*:33061|0\.0\.0\.0:33061'; then
            echo "FAIL: mysqld is listening on all interfaces — LAN exposure detected"; exit 1
          fi
          echo "OK: mysqld bound to loopback only — no LAN exposure"

          echo "================ mysql client connect + write/read ================"
          "$MYSQL_BIN/mysql" --host=127.0.0.1 --port=33061 -u root -e \
            "CREATE DATABASE citest; CREATE TABLE citest.t(id INT); INSERT INTO citest.t VALUES (1),(2),(3);"
          COUNT=$("$MYSQL_BIN/mysql" --host=127.0.0.1 --port=33061 -u root -N -e "SELECT COUNT(*) FROM citest.t;")
          [ "$COUNT" = "3" ] && echo "OK: mysql client read back expected row count" || { echo "FAIL: unexpected row count $COUNT"; exit 1; }

          echo "================ mysqldump ================"
          "$MYSQL_BIN/mysqldump" --host=127.0.0.1 --port=33061 -u root citest > "$DATADIR/citest.sql"
          grep -q "CREATE TABLE" "$DATADIR/citest.sql" && echo "OK: mysqldump produced valid SQL" || { echo "FAIL: mysqldump output looks wrong"; exit 1; }

          echo "================ graceful shutdown ================"
          "$MYSQL_BIN/mysqladmin" --host=127.0.0.1 --port=33061 -u root shutdown
          wait "$MYSQLD_TEST_PID" 2>/dev/null || true
          echo "OK: mysqld shut down cleanly (bundled $MYSQL_ARCH_DIR binary fully functional)"

      - name: Standalone runtime validation (live packaged app — first run, persistence, local-only guarantee, crash recovery, backup)
        working-directory: frontend
        timeout-minutes: 15
        run: |
          set -e
          # The job-level env: DATABASE_URL (set further up in this workflow
          # for the `prisma generate` step, pointing at a placeholder
          # 127.0.0.1:3306 that nothing ever listens on) is inherited by
          # every step's shell by default, including this one — and by any
          # child process this step launches. The packaged Standalone app
          # itself generates its OWN correct backend/.env DATABASE_URL
          # (pointing at the managed mysqld this job's earlier step already
          # proved works, on 127.0.0.1:33061), but dotenv.config() never
          # overwrites a key that's already present in process.env, so the
          # inherited CI placeholder silently wins and Prisma fails with
          # P1001 against a port nothing is bound to. No real end-user
          # install ever has an external DATABASE_URL set this way — this is
          # purely a CI-harness artifact, so it's cleared here rather than
          # anywhere in the app itself.
          unset DATABASE_URL
          NATIVE_ARCH=$(uname -m)
          if [ "$NATIVE_ARCH" = "arm64" ]; then MYSQL_ARCH_DIR="arm64"; else MYSQL_ARCH_DIR="x64"; fi
          # Same reasoning + same word-splitting fix as the direct-MySQL-
          # binary-test step above: pick the .app bundle whose OWN bundled
          # mysql/<arch> matches this runner's native arch, via a
          # newline-delimited `while read` loop (NOT `for d in $(find ...)`,
          # which word-splits on the spaces in "PETSHROW ERP Standalone.app"
          # and never matches anything).
          APP_DIR=""
          while IFS= read -r d; do
            if [ -d "$d/Contents/Resources/mysql/$MYSQL_ARCH_DIR" ]; then APP_DIR="$d"; break; fi
          done < <(find ../dist-electron-standalone -type d -name "*.app" -not -path "*/Contents/*")
          [ -n "$APP_DIR" ] || { echo "FAIL: no .app bundle found containing mysql/$MYSQL_ARCH_DIR (native arch: $NATIVE_ARCH)"; exit 1; }
          echo "Using native-arch bundle: $APP_DIR"
          BIN=$(find "$APP_DIR/Contents/MacOS" -type f -maxdepth 1 | head -n1)
          MYSQL_BIN="$APP_DIR/Contents/Resources/mysql/$MYSQL_ARCH_DIR/bin"
          DATA_ROOT="$HOME/Library/Application Support/PETSHROW ERP Standalone"

          wait_for_health() {
            local timeout=$1
            local waited=0
            while [ "$waited" -lt "$timeout" ]; do
              if curl -sf http://127.0.0.1:33071/api/health >/dev/null 2>&1; then return 0; fi
              sleep 2
              waited=$((waited + 2))
            done
            return 1
          }

          echo "================ FIRST RUN — clean init ================"
          echo "Launching: $BIN"
          "$BIN" > /tmp/standalone-run1.log 2>&1 &
          RUN1_PID=$!

          if wait_for_health 150; then
            echo "OK: backend reported healthy on first run"
          else
            echo "FAIL: backend never became healthy on first run"
            echo "================ startup log ================"; cat /tmp/standalone-run1.log
            exit 1
          fi

          echo "================ startup sequence markers ================"
          for marker in "Mac Standalone" "Managed MySQL ready" "health OK" "database connected"; do
            grep -q "$marker" /tmp/standalone-run1.log && echo "OK: found marker '$marker'" || { echo "FAIL: missing startup marker '$marker'"; cat /tmp/standalone-run1.log; exit 1; }
          done

          echo "================ asset smoke test — no broken bundled resource on real first run ================"
          if grep -q "\[AssetSmokeTest\]" /tmp/standalone-run1.log; then
            echo "FAIL: a bundled asset failed to load on first run — see [AssetSmokeTest] lines above"
            grep "\[AssetSmokeTest\]" /tmp/standalone-run1.log
            exit 1
          fi
          echo "OK: no [AssetSmokeTest] failures in the first-run launch log"

          echo "================ data layout — outside the .app bundle ================"
          test -d "$DATA_ROOT" || { echo "FAIL: $DATA_ROOT missing"; exit 1; }
          for sub in database config logs backups exports temp; do
            test -d "$DATA_ROOT/$sub" && echo "OK: $sub/ present" || { echo "FAIL: $sub/ missing"; exit 1; }
          done
          [ "$(ls -A "$DATA_ROOT/database/mysql" 2>/dev/null | wc -l)" -gt 0 ] && echo "OK: mysql datadir populated" || { echo "FAIL: mysql datadir empty"; exit 1; }
          case "$DATA_ROOT" in
            "$APP_DIR"*) echo "FAIL: data root is INSIDE the .app bundle"; exit 1 ;;
            *) echo "OK: data root is outside the .app bundle" ;;
          esac

          echo "================ write test data + verify persistence (pre-restart) ================"
          MARK="petshrow-ci-persistence-$(date +%s)"
          curl -sf -X PUT http://127.0.0.1:33071/api/settings/company -H "Content-Type: application/json" -d "{\"company_name_ar\":\"$MARK\"}" > /dev/null
          GOT=$(curl -sf http://127.0.0.1:33071/api/settings/company | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).company_name_ar||''))")
          [ "$GOT" = "$MARK" ] && echo "OK: test value written and read back" || { echo "FAIL: value not persisted before restart (got '$GOT')"; exit 1; }

          echo "================ graceful quit + orphan process check ================"
          kill -TERM "$RUN1_PID" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$RUN1_PID" 2>/dev/null || break; sleep 1; done
          sleep 2
          ORPHAN_MYSQL=$(pgrep -f "mysqld.*PETSHROW ERP Standalone" || true)
          ORPHAN_BACKEND=$(pgrep -f "backend/src/index.js" || true)
          if [ -n "$ORPHAN_MYSQL" ] || [ -n "$ORPHAN_BACKEND" ]; then
            echo "FAIL: orphan process(es) remain after graceful quit: mysqld=[$ORPHAN_MYSQL] backend=[$ORPHAN_BACKEND]"; exit 1
          fi
          echo "OK: no orphan mysqld/backend processes after graceful quit"

          echo "================ LOCAL-ONLY GUARANTEE — tamper connection-settings.json, relaunch ================"
          mkdir -p "$DATA_ROOT/config"
          cat > "$DATA_ROOT/config/connection-settings.json" <<'JSON'
          {"mode":"server","serverUrl":"http://198.51.100.50:5000"}
          JSON
          echo "Tampered connection-settings.json to mode=server pointing at a bogus remote (198.51.100.50)"

          "$BIN" > /tmp/standalone-run2.log 2>&1 &
          RUN2_PID=$!

          if wait_for_health 90; then
            echo "OK: local backend started on 127.0.0.1:33071 despite tampered mode=server settings"
          else
            echo "FAIL: local backend did not start — Standalone may have tried to honor the tampered remote mode"
            cat /tmp/standalone-run2.log; exit 1
          fi
          if grep -q "198.51.100.50" /tmp/standalone-run2.log; then
            echo "FAIL: app referenced the bogus remote address — local-only guarantee violated"; exit 1
          fi
          echo "OK: no reference anywhere in the startup log to the tampered remote address"

          if grep -q "\[AssetSmokeTest\]" /tmp/standalone-run2.log; then
            echo "FAIL: a bundled asset failed to load on the tampered-relaunch run — see [AssetSmokeTest] lines above"
            grep "\[AssetSmokeTest\]" /tmp/standalone-run2.log
            exit 1
          fi
          echo "OK: no [AssetSmokeTest] failures in the second-run (relaunch) log"

          GOT2=$(curl -sf http://127.0.0.1:33071/api/settings/company | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).company_name_ar||''))")
          [ "$GOT2" = "$MARK" ] && echo "OK: data survived a full app restart — database persistence confirmed" || { echo "FAIL: persisted value lost across restart (got '$GOT2', expected '$MARK')"; exit 1; }

          echo "================ CRASH RECOVERY — managed MySQL ================"
          MYSQLD_PID=$(pgrep -f "mysqld.*PETSHROW ERP Standalone" | head -n1)
          [ -n "$MYSQLD_PID" ] || { echo "FAIL: could not find live managed mysqld process"; exit 1; }
          kill -9 "$MYSQLD_PID"
          echo "Killed mysqld (pid $MYSQLD_PID) — waiting for automatic restart"
          sleep 6
          if wait_for_health 90; then echo "OK: recovered after mysqld crash"; else echo "FAIL: no recovery after mysqld crash"; exit 1; fi
          NEW_MYSQLD_PID=$(pgrep -f "mysqld.*PETSHROW ERP Standalone" | head -n1)
          [ -n "$NEW_MYSQLD_PID" ] && [ "$NEW_MYSQLD_PID" != "$MYSQLD_PID" ] && echo "OK: a new mysqld process is running (pid $NEW_MYSQLD_PID, was $MYSQLD_PID)" || { echo "FAIL: mysqld did not actually restart with a new pid"; exit 1; }

          echo "================ CRASH RECOVERY — backend ================"
          BACKEND_PID=$(pgrep -f "backend/src/index.js" | head -n1)
          [ -n "$BACKEND_PID" ] || { echo "FAIL: could not find live backend process"; exit 1; }
          kill -9 "$BACKEND_PID"
          echo "Killed backend (pid $BACKEND_PID) — waiting for automatic restart"
          sleep 5
          if wait_for_health 90; then echo "OK: backend recovered after crash"; else echo "FAIL: backend did not restart after crash"; exit 1; fi

          echo "================ BACKUP MECHANISM — mysqldump/restore against the LIVE managed instance ================"
          CREDS_FILE="$DATA_ROOT/config/mysql-credentials.json"
          test -f "$CREDS_FILE" || { echo "FAIL: mysql-credentials.json not found"; exit 1; }
          DB_USER=$(node -e "console.log(require('$CREDS_FILE').user)")
          DB_PASS=$(node -e "console.log(require('$CREDS_FILE').password)")
          DB_NAME=$(node -e "console.log(require('$CREDS_FILE').database)")

          # --no-tablespaces: matches standaloneBackup.js's own mysqldump
          # invocation (the actual mechanism this step exercises) — without
          # it, mysqldump 8.x tries to dump tablespace metadata, which needs
          # the global PROCESS privilege the app's scoped-per-database user
          # intentionally doesn't have (confirmed on a real CI run,
          # 2026-08-15: "Access denied; you need ... PROCESS privilege(s)").
          "$MYSQL_BIN/mysqldump" --host=127.0.0.1 --port=33061 --user="$DB_USER" --password="$DB_PASS" --single-transaction --no-tablespaces "$DB_NAME" | gzip > /tmp/ci-backup.sql.gz
          [ -s /tmp/ci-backup.sql.gz ] && echo "OK: backup archive created and non-empty" || { echo "FAIL: backup archive empty"; exit 1; }
          gzip -t /tmp/ci-backup.sql.gz && echo "OK: backup archive is a valid gzip stream" || { echo "FAIL: corrupt gzip archive"; exit 1; }
          gzip -dc /tmp/ci-backup.sql.gz | grep -q "CREATE TABLE" && echo "OK: backup contains real schema (proves mechanism against the actual migrated DB)" || { echo "FAIL: backup missing expected SQL content"; exit 1; }

          curl -sf -X PUT http://127.0.0.1:33071/api/settings/company -H "Content-Type: application/json" -d '{"company_name_ar":"corrupted-before-restore"}' > /dev/null

          echo "================ RESTORE LIFECYCLE — mirrors the real backup:restore IPC handler ================"
          # The real handler (frontend/electron/ipc.js) stops the backend
          # BEFORE restoring (so no live process can serve a stale in-memory
          # cache — see companySettingsStore.js's 60s TTL cache), then
          # restarts it fresh afterward. A raw restore into a still-running
          # backend never reproduces that — this block does the same
          # stop -> restore -> clear-marker -> restart sequence the app
          # itself performs, instead of relying on the cache TTL to expire.
          echo "Gracefully stopping the backend before restore (same precondition backup:restore enforces)"
          kill -TERM "$RUN2_PID" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$RUN2_PID" 2>/dev/null || break; sleep 1; done
          sleep 2

          gzip -dc /tmp/ci-backup.sql.gz | "$MYSQL_BIN/mysql" --host=127.0.0.1 --port=33061 --user="$DB_USER" --password="$DB_PASS" "$DB_NAME"
          echo "OK: SQL restored into the managed instance"

          # Mirrors ipc.js's backup:restore handler: force migrateAndSeed.js
          # to re-check `prisma migrate deploy` on the next startup by
          # clearing `migrated` in the same marker file the real restore
          # flow clears — migrate deploy is idempotent, so this only ever
          # adds work, never skips something needed.
          MARKER_FILE="$DATA_ROOT/.initialized.json"
          test -f "$MARKER_FILE" || { echo "FAIL: $MARKER_FILE not found — cannot mirror real restore's marker-clear step"; exit 1; }
          node -e "
            const fs = require('fs');
            const p = '$MARKER_FILE';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.migrated = false;
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          "
          echo "OK: cleared migrated flag in .initialized.json (mirrors real restore's marker-clear step)"

          echo "Relaunching the packaged app — mirrors the real restore flow's backend restart"
          "$BIN" > /tmp/standalone-run3.log 2>&1 &
          RUN3_PID=$!

          if wait_for_health 120; then
            echo "OK: backend healthy after restore-lifecycle relaunch"
          else
            echo "FAIL: backend never became healthy after restore-lifecycle relaunch"
            cat /tmp/standalone-run3.log; exit 1
          fi

          if grep -q "\[AssetSmokeTest\]" /tmp/standalone-run3.log; then
            echo "FAIL: a bundled asset failed to load on the post-restore relaunch — see [AssetSmokeTest] lines above"
            grep "\[AssetSmokeTest\]" /tmp/standalone-run3.log
            exit 1
          fi
          echo "OK: no [AssetSmokeTest] failures in the post-restore relaunch log"

          GOT3=$(curl -sf http://127.0.0.1:33071/api/settings/company | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).company_name_ar||''))")
          [ "$GOT3" = "$MARK" ] && echo "OK: restore recovered the pre-mutation value ($MARK) — verified via a fresh backend process, matching real Restore semantics" || { echo "FAIL: restore did not recover expected value (got '$GOT3', expected '$MARK')"; exit 1; }
          echo "NOTE: this proves the backup/restore MECHANISM end-to-end against the live managed instance, including the same stop-restore-restart lifecycle the app's own 'backup:restore' IPC handler performs (same mysqldump/mysql binaries and credentials the app's Backups panel uses). The renderer's 'Backup Now'/'Restore' buttons themselves were not driven via automated GUI clicking."

          echo "================ SYNTHETIC SCALE SMOKE TEST (small, NOT the 1,000,000+ row requirement) ================"
          (
            set -e
            BRANCH_ID=$("$MYSQL_BIN/mysql" --host=127.0.0.1 --port=33061 --user="$DB_USER" --password="$DB_PASS" -N -e "SELECT id FROM branches LIMIT 1;" "$DB_NAME")
            [ -n "$BRANCH_ID" ] || { echo "no seeded branch found — skipping"; exit 1; }
            N=2000
            echo "Bulk-inserting $N synthetic employees against branchId=$BRANCH_ID"
            VALUES=""
            for i in $(seq 1 "$N"); do
              [ -n "$VALUES" ] && VALUES="$VALUES,"
              VALUES="$VALUES('CI Scale Test $i','CI-SCALE-$i',$BRANCH_ID,NOW(),NOW())"
            done
            START=$(date +%s)
            "$MYSQL_BIN/mysql" --host=127.0.0.1 --port=33061 --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" -e \
              "INSERT INTO employees (name, zkUserId, branchId, createdAt, updatedAt) VALUES $VALUES;"
            INSERT_MS=$((($(date +%s) - START) * 1000))
            START2=$(date +%s)
            RESULT=$(curl -sf "http://127.0.0.1:33071/api/employees?limit=50" -o /dev/null -w "%{http_code}")
            QUERY_MS=$((($(date +%s) - START2) * 1000))
            echo "OK: inserted $N synthetic employees in ~${INSERT_MS}ms; /api/employees responded $RESULT in ~${QUERY_MS}ms afterward"
            "$MYSQL_BIN/mysql" --host=127.0.0.1 --port=33061 --user="$DB_USER" --password="$DB_PASS" "$DB_NAME" -e "DELETE FROM employees WHERE zkUserId LIKE 'CI-SCALE-%';"
            echo "Cleaned up synthetic rows"
          ) || echo "SCALE SMOKE TEST: SKIPPED/FAILED (non-blocking, best-effort only) — 1,000,000+ rows: NOT TESTED regardless"
          echo "1,000,000+ AttendanceLog rows: NOT TESTED (out of scope for this CI runner/budget)"
          echo "Windows-vs-Mac payroll numeric parity: NOT TESTED (no live Windows Server 1.1.2 instance available to this CI job)"

          echo "================ final quit + orphan check ================"
          kill -TERM "$RUN3_PID" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$RUN3_PID" 2>/dev/null || break; sleep 1; done
          sleep 2
          pkill -9 -f "mysqld.*PETSHROW ERP Standalone" 2>/dev/null || true
          FINAL_ORPHAN_MYSQL=$(pgrep -f "mysqld.*PETSHROW ERP Standalone" || true)
          FINAL_ORPHAN_BACKEND=$(pgrep -f "backend/src/index.js" || true)
          if [ -n "$FINAL_ORPHAN_MYSQL" ] || [ -n "$FINAL_ORPHAN_BACKEND" ]; then
            echo "FAIL: orphan process(es) remain at end of job: mysqld=[$FINAL_ORPHAN_MYSQL] backend=[$FINAL_ORPHAN_BACKEND]"; exit 1
          fi
          echo "OK: no orphan processes at end of job"
          echo "================ ALL RUNTIME VALIDATION CHECKS PASSED ================"

      - name: Upload Standalone artifacts
        uses: actions/upload-artifact@v4
        with:
          name: petshrow-macos-standalone
          path: |
            dist-electron-standalone/*.dmg
            dist-electron-standalone/*.zip
          if-no-files-found: error

      - name: Upload Standalone artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
           dist-electron-standalone/*.dmg
           dist-electron-standalone/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-mojave:
    name: Build macOS Client (Mojave / Electron 26.6.10)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.edition == 'all' || github.event.inputs.edition == 'mac-client-legacy'
    runs-on: macos-15-intel

    permissions:
      contents: write

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('backend/prisma/schema.prisma') }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production asset check (pre-build)
        working-directory: frontend
        run: npm run assets:verify:source

      - name: Build Frontend (Manager edition — client-only, server mode)
        working-directory: frontend
        run: npm run build:manager

      - name: Build Mojave CommonJS main-process bundle
        working-directory: frontend
        run: npm run build:mojave-main

      - name: Build macOS Mojave DMG
        working-directory: frontend
        run: npx electron-builder --mac --config electron-builder.legacy-mac.json --publish=never

      - name: Find Build Files
        run: |
          echo "Current directory:"
          pwd

          echo "================ DMG FILES ================"
          find . -type f -name "*.dmg"

          echo "================ ZIP FILES ================"
          find . -type f -name "*.zip"

          echo "================ DIST DIRECTORIES ================"
          find . -type d -name "dist*"

      - name: Inspect packaged app (main entry, arch, min OS version, ESM check)
        working-directory: frontend
        timeout-minutes: 10
        run: |
          set -e
          APP_DIR=$(find ../dist-electron-legacy -type d -name "*.app" | head -n1)
          echo "App bundle: $APP_DIR"

          echo "================ Info.plist (arch / min OS) ================"
          plutil -p "$APP_DIR/Contents/Info.plist" | grep -iE "LSMinimumSystemVersion|CFBundleExecutable" || true
          MIN_OS=$(plutil -extract LSMinimumSystemVersion raw "$APP_DIR/Contents/Info.plist")
          if [ "$MIN_OS" != "10.14.0" ]; then
            echo "FAIL: LSMinimumSystemVersion is $MIN_OS, expected 10.14.0"; exit 1
          else
            echo "OK: LSMinimumSystemVersion is 10.14.0"
          fi
          file "$APP_DIR/Contents/MacOS/"* || true
          if ! file "$APP_DIR/Contents/MacOS/"* | grep -q "x86_64"; then
            echo "FAIL: packaged binary is not x86_64"; exit 1
          else
            echo "OK: packaged binary is x86_64"
          fi

          RESOURCES="$APP_DIR/Contents/Resources"
          echo "================ Extracting app.asar ================"
          npx asar extract "$RESOURCES/app.asar" /tmp/asar-extracted

          echo "================ packaged package.json main field ================"
          node -e "console.log(require('/tmp/asar-extracted/package.json').main)"

          echo "================ electron.mojave.cjs present? ================"
          ls -la /tmp/asar-extracted/electron.mojave.cjs

          echo "================ electron.js should NOT be present ================"
          if [ -e /tmp/asar-extracted/electron.js ]; then
            echo "FAIL: electron.js is packaged"; exit 1
          else
            echo "OK: electron.js not packaged"
          fi

          echo "================ ESM syntax check on electron.mojave.cjs ================"
          if grep -nE "^\s*(import |export )" /tmp/asar-extracted/electron.mojave.cjs; then
            echo "FAIL: ESM import/export syntax found in electron.mojave.cjs"; exit 1
          else
            echo "OK: no ESM import/export syntax found"
          fi

          echo "================ Electron runtime version ================"
          FRAMEWORK_PLIST="$APP_DIR/Contents/Frameworks/Electron Framework.framework/Versions/A/Resources/Info.plist"
          FRAMEWORK_BIN="$APP_DIR/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework"

          if [ ! -f "$FRAMEWORK_PLIST" ]; then
            echo "FAIL: Electron Framework Info.plist not found at $FRAMEWORK_PLIST"
            echo "================ Frameworks directory contents (for diagnosis) ================"
            find "$APP_DIR/Contents/Frameworks" -maxdepth 2 || true
            exit 1
          fi

          set +e
          ELECTRON_RUNTIME_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$FRAMEWORK_PLIST" 2>&1)
          PLISTBUDDY_STATUS=$?
          set -e
          echo "Bundled Electron Framework version: $ELECTRON_RUNTIME_VERSION"
          if [ $PLISTBUDDY_STATUS -ne 0 ] || [ "$ELECTRON_RUNTIME_VERSION" != "26.6.10" ]; then
            echo "FAIL: bundled Electron Framework version is '$ELECTRON_RUNTIME_VERSION' (PlistBuddy exit $PLISTBUDDY_STATUS), expected 26.6.10"
            echo "================ Full Electron Framework Info.plist (for diagnosis) ================"
            plutil -p "$FRAMEWORK_PLIST" || true
            exit 1
          else
            echo "OK: bundled Electron Framework version is 26.6.10"
          fi

          FRAMEWORK_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$FRAMEWORK_PLIST" 2>&1)
          FRAMEWORK_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$FRAMEWORK_PLIST" 2>&1)
          echo "Electron Framework CFBundleIdentifier: $FRAMEWORK_IDENTIFIER"
          echo "Electron Framework CFBundleExecutable: $FRAMEWORK_EXECUTABLE"

          echo "================ Electron Framework binary architecture ================"
          if [ ! -f "$FRAMEWORK_BIN" ]; then
            echo "FAIL: Electron Framework binary not found at $FRAMEWORK_BIN"; exit 1
          fi
          file "$FRAMEWORK_BIN"
          if ! file "$FRAMEWORK_BIN" | grep -q "x86_64"; then
            echo "FAIL: Electron Framework binary is not x86_64"; exit 1
          else
            echo "OK: Electron Framework binary is x86_64"
          fi

      - name: Production asset check (packaged)
        working-directory: frontend
        run: node scripts/assetSafety/verify-packaged.mjs mac-client-legacy

      - name: Launch packaged app and check for ERR_REQUIRE_ESM
        working-directory: frontend
        timeout-minutes: 5
        run: |
          set +e
          APP_DIR=$(find ../dist-electron-legacy -type d -name "*.app" | head -n1)
          BIN=$(find "$APP_DIR/Contents/MacOS" -type f -maxdepth 1 | head -n1)
          echo "Launching: $BIN"

          "$BIN" > /tmp/app-launch.log 2>&1 &
          APP_PID=$!

          sleep 8
          kill "$APP_PID" 2>/dev/null
          pkill -f "$APP_DIR" 2>/dev/null
          wait "$APP_PID" 2>/dev/null

          echo "================ Launch output ================"
          cat /tmp/app-launch.log

          if grep -q "ERR_REQUIRE_ESM" /tmp/app-launch.log; then
            echo "FAIL: ERR_REQUIRE_ESM detected in launch output"
            exit 1
          else
            echo "OK: no ERR_REQUIRE_ESM in launch output"
          fi

          if grep -q "\[AssetSmokeTest\]" /tmp/app-launch.log; then
            echo "FAIL: a bundled asset failed to load — see [AssetSmokeTest] lines above"
            grep "\[AssetSmokeTest\]" /tmp/app-launch.log
            exit 1
          else
            echo "OK: no [AssetSmokeTest] failures in launch output"
          fi

      - name: Upload Mojave DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: petshrow-macos-mojave-x64-20.26.10
          path: dist-electron-legacy/*.dmg
          if-no-files-found: error

      - name: Upload Mojave DMG to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
           dist-electron-legacy/*.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
